<!DOCTYPE html>
<html>
<head>
  <title>Heatmap View</title>
  <meta charset="UTF-8" />
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
  <h2>Per-treatment average expression</h2>
  <div id="heatmap-container" style="width:1400px; height:500px;">Loading heatmap...</div>

  <script>
    // Get query parameter
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id) {
      document.getElementById("heatmap-container").innerText = "No ID provided.";
    } else {
      document.getElementById("heatmap-container").innerText = "";
      fetch("entries/exprdata.json") // Your JSON with heatmap data
        .then(res => res.json())
        .then(data => {
          const heatmapData = data[id]; // Use the id to select correct heatmap

          if (!heatmapData) {
            document.getElementById("heatmap-container").innerText = "Heatmap not found for this ID. Expression too low in all samples.";
            return;
          }

          // Build Plotly heatmap
          const trace = {
            z: heatmapData.z,
            x: heatmapData.x || null,
            y: heatmapData.y || null,
            type: 'heatmap',
            colorscale: 'Viridis'
          };

          const layout = {
            title: `Averaged expression (in TPMs) per tissue - ${id}`,
            margin: { t: 50 , r: 100, l: 100}
          };

          Plotly.newPlot('heatmap-container', [trace], layout);
        })
        .catch(err => {
          document.getElementById("heatmap-container").innerText = "Error loading heatmap data.";
          console.error(err);
        });
    }
  </script>
</body>
</html>
