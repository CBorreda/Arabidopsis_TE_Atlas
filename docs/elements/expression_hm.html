<!DOCTYPE html>
<html>
<head>
  <title>Heatmap View</title>
  <meta charset="UTF-8" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<script>
    // Get query parameter
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
</script>
<body>
  <h2 id="page-heading">Loading...</h2>
  <div id="heatmap-container1" style="width:1400px; height:350px;"></div>
  <div id="heatmap-container2" style="width:1400px; height:350px;"></div>

  <script>
    // Get query parameter

    
    if (!id) {
        document.getElementById("heatmap-container1").innerText = "";
        document.getElementById("heatmap-container2").innerText = "";
        document.getElementById("page-heading").innerText = "No ID provided.";
    } else {
      // Lista de JSONs a cargar
      const jsonFiles = [
        { url: "entries/exprdata.json", container: "heatmap-container1", colorscale: "Viridis" , plotname: 'Wild type'},
        { url: "entries/exprdata_ddm1.json", container: "heatmap-container2", colorscale: "Viridis" , plotname:'Methylation compromised' }
      ];
     document.getElementById("page-heading").innerText = `Gene expression for ${id} under different conditions`;  
      jsonFiles.forEach(file => {
        fetch(file.url)
          .then(res => res.json())
          .then(data => {
            const heatmapData = data[id];
            if (!heatmapData) {
              document.getElementById(file.container).innerText =
                `Heatmap not found for ${id} in ${file.plotname} - Likely all samples have low expression`;
              return;
            }

            const trace = {
              z: heatmapData.z,
              x: heatmapData.x || null,
              y: heatmapData.y || null,
              type: "heatmap",
              colorscale: file.colorscale,
              colorbar: {
                title: "TPM",       // título de la barra
                thickness: 20,      // grosor en píxeles
                len: 1.8,           // longitud relativa (0-1)
                y: 0.5,             // posición vertical
                yanchor: "middle",
                x: 1.05
              }
            };

            const layout = {
              title: `Averaged expression (in TPMs) per tissue - ${file.plotname}`,
              margin: { t: 50, r: 100, l: 100, b: 200 },
              scale: 10,
              xaxis: { dtick : 1},
            };

            Plotly.newPlot(file.container, [trace], layout);
          })
          .catch(err => {
            document.getElementById(file.container).innerText =
              `Error loading ${file.plotname}`;
            console.error(err);
          });
      });
    }
  </script>
</body>
</html>
